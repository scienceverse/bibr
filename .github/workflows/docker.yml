name: Container delivery

on:
  workflow_call:
    inputs:
      channel:
        description: Movable tag channel to promote after scanning
        required: true
        type: string
      source_sha:
        description: Full source commit SHA to build
        required: true
        type: string
      version:
        description: Release version without a leading v
        required: false
        type: string
    outputs:
      image_digest:
        description: Verified registry digest
        value: ${{ jobs.publish.outputs.digest }}
  workflow_dispatch:
    inputs:
      channel:
        description: Promotion channel
        required: true
        type: choice
        options: [edge, release]
      source_sha:
        description: Full source commit SHA to build
        required: true
        type: string
      version:
        description: Required for release promotion, without a leading v
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ inputs.channel }}-${{ inputs.source_sha }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CHANNEL: ${{ inputs.channel }}

jobs:
  publish:
    name: Build, scan, and promote one image digest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.channel == 'release' && 'ghcr-release' || 'ghcr-edge' }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Validate immutable source and channel
        id: source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a full lowercase Git SHA" >&2
            exit 1
          fi
          if [[ "$CHANNEL" != "edge" && "$CHANNEL" != "release" ]]; then
            echo "channel must be edge or release" >&2
            exit 1
          fi
          if [[ "$CHANNEL" == "release" && ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release channel requires an X.Y.Z version" >&2
            exit 1
          fi
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ steps.source.outputs.sha }}

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo docker image prune --all --force
          df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push only the quarantine identity
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          context: .
          file: Dockerfile.serve
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:quarantine-${{ steps.source.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            WITH_GPU=true
            BIBR_BUILD_SHA=${{ steps.source.outputs.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the exact registry digest
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy.sarif

      - name: Retain the vulnerability report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-${{ steps.source.outputs.sha }}
          path: trivy.sarif
          if-no-files-found: warn
          retention-days: 30

      - name: Block promotion when the digest scan failed
        if: always() && steps.trivy.outcome != 'success'
        run: |
          echo "The quarantine digest failed the blocking HIGH/CRITICAL scan." >&2
          exit 1

      - name: Promote the verified digest without rebuilding
        id: promote
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          image="$REGISTRY/$IMAGE_NAME"
          source="$image@$DIGEST"
          if [[ "$CHANNEL" == "edge" ]]; then
            docker buildx imagetools create --tag "$image:edge" "$source"
            echo "tags=edge" >> "$GITHUB_OUTPUT"
          else
            IFS=. read -r major minor patch <<< "$VERSION"
            docker buildx imagetools create \
              --tag "$image:v$major.$minor.$patch" \
              --tag "$image:$major.$minor" \
              --tag "$image:$major" \
              --tag "$image:latest" \
              "$source"
            echo "tags=v$VERSION,$major.$minor,$major,latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize verified artifact
        if: always()
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PROMOTED_TAGS: ${{ steps.promote.outputs.tags }}
          SCAN_OUTCOME: ${{ steps.trivy.outcome }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          {
            echo "## Container delivery"
            echo
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Digest: \`$DIGEST\`"
            echo "- Scan outcome: \`$SCAN_OUTCOME\`"
            echo "- Promoted tags: \`${PROMOTED_TAGS:-none}\`"
            echo "- BuildKit provenance: enabled"
            echo "- BuildKit SBOM: enabled"
          } >> "$GITHUB_STEP_SUMMARY"
