name: Container delivery

on:
  workflow_call:
    inputs:
      channel:
        description: Movable tag channel to promote after scanning
        required: true
        type: string
      source_sha:
        description: Full source commit SHA to build
        required: true
        type: string
      version:
        description: Release version without a leading v
        required: false
        type: string
    outputs:
      image_digest:
        description: Verified registry digest
        value: ${{ jobs.publish.outputs.digest }}
  workflow_dispatch:
    inputs:
      channel:
        description: Promotion channel
        required: true
        type: choice
        options: [edge, release]
      source_sha:
        description: Full source commit SHA to build
        required: true
        type: string
      version:
        description: Required for release promotion, without a leading v
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ inputs.channel }}-${{ inputs.source_sha }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CHANNEL: ${{ inputs.channel }}
  CI_BUILDX_CACHE: ${{ vars.CI_BUILDX_CACHE || '/mnt/data/ci/buildx-cache' }}
  UV_VERSION: "0.9.8"
  PYTHON_VERSION: "3.12"

jobs:
  publish:
    name: Build, scan, and promote one image digest
    # Registry delivery is opt-in, including direct manual dispatches. CI's
    # unprivileged container build and vulnerability gate remain independent.
    if: ${{ vars.PUBLISH_GHCR == 'true' }}
    runs-on: >-
      ${{ github.event.repository.private &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
      && vars.CI_RUNNER || 'ubuntu-latest' }}
    # Release builds run cold (see the build step), which roughly doubles their time.
    timeout-minutes: ${{ inputs.channel == 'release' && 120 || 60 }}
    environment: ${{ inputs.channel == 'release' && 'ghcr-release' || 'ghcr-edge' }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Validate immutable source and channel
        id: source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a full lowercase Git SHA" >&2
            exit 1
          fi
          if [[ "$CHANNEL" != "edge" && "$CHANNEL" != "release" ]]; then
            echo "channel must be edge or release" >&2
            exit 1
          fi
          if [[ "$CHANNEL" == "release" && ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release channel requires an X.Y.Z version" >&2
            exit 1
          fi
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Full history brings origin/main and the release tags for the checks below.
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.source.outputs.sha }}

      - name: Install locked uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false

      # The same source checks as release.yml's validate job, so a manual dispatch
      # cannot publish an unmerged commit (any SHA GitHub serves, including a fork
      # pull request's head) or label a commit with a version it does not carry.
      # The fully qualified ref matters: a pushed tag named origin/main would win
      # the short name's lookup.
      - name: Require a main commit and, for releases, its version tag
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          VERSION: ${{ steps.source.outputs.version }}
        shell: bash
        run: |
          if ! git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main; then
            echo "source commit $SOURCE_SHA is not reachable from origin/main" >&2
            exit 1
          fi
          if [[ "$CHANNEL" == "release" ]]; then
            # setup-uv only selects UV_PYTHON; uv runs that interpreter.
            project_version=$(uv run --no-project python -c \
              "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
            if [[ "$project_version" != "$VERSION" ]]; then
              echo "version $VERSION does not match project version $project_version" >&2
              exit 1
            fi
            if ! tag_sha=$(git rev-parse --verify --quiet "refs/tags/v$VERSION^{commit}") ||
                [[ "$tag_sha" != "$SOURCE_SHA" ]]; then
              echo "tag v$VERSION does not exist or does not point at $SOURCE_SHA" >&2
              exit 1
            fi
          fi

      - name: Free runner disk space
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo docker image prune --all --force
          df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.0.0
        with:
          driver-opts: ${{ runner.environment == 'self-hosted' && 'memory=32g,cpu-quota=600000,cpu-period=100000' || '' }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Read CI's shared layer cache through a hard-linked snapshot taken under the
      # lock CI's swap holds, so a concurrent swap cannot remove blobs mid-build.
      - name: Snapshot the shared layer cache
        id: cache
        if: runner.environment == 'self-hosted' && inputs.channel != 'release'
        shell: bash
        env:
          CACHE_DIR: ${{ env.CI_BUILDX_CACHE }}
        run: |
          CACHE_DIR="${CACHE_DIR%/}"
          job_dir="${CACHE_DIR}.job-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          mkdir -p "$(dirname "$CACHE_DIR")"
          exec 9>"${CACHE_DIR}.lock"
          flock 9
          mkdir -p "$CACHE_DIR"
          rm -rf "${job_dir:?}"
          mkdir -p "$job_dir"
          cp -R -l "$CACHE_DIR" "$job_dir/read"
          echo "dir=$job_dir" >> "$GITHUB_OUTPUT"

      - name: Build and push only the quarantine identity
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.0.0
        with:
          context: .
          file: Dockerfile.serve
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:quarantine-${{ steps.source.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            WITH_GPU=true
            BIBR_BUILD_SHA=${{ steps.source.outputs.sha }}
          provenance: mode=max
          sbom: true
          # CI already exports the GPU build's local cache. Edge delivery only
          # reads it: uploading another multi-GB cache after pushing the image can
          # consume the job timeout before the mandatory scan starts. Release
          # builds read no cache at all, because pull request jobs share the hosts
          # and the cache that CI exports.
          no-cache: ${{ inputs.channel == 'release' }}
          cache-from: ${{ inputs.channel != 'release' && (runner.environment == 'self-hosted' && format('type=local,src={0}/read', steps.cache.outputs.dir) || 'type=gha') || '' }}

      - name: Release the layer cache snapshot
        if: always() && steps.cache.outputs.dir != ''
        env:
          JOB_DIR: ${{ steps.cache.outputs.dir }}
        run: rm -rf "${JOB_DIR:?}"

      - name: Scan the exact registry digest
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          # SARIF otherwise resets the severity filter to every level, which
          # makes MEDIUM/LOW findings fail the stated HIGH/CRITICAL gate.
          limit-severities-for-sarif: true
          output: trivy.sarif

      - name: Retain the vulnerability report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-${{ steps.source.outputs.sha }}
          path: trivy.sarif
          if-no-files-found: warn
          retention-days: 30

      - name: Block promotion when the digest scan failed
        if: always() && steps.trivy.outcome != 'success'
        run: |
          echo "The quarantine digest failed the blocking HIGH/CRITICAL scan." >&2
          exit 1

      # Optional local handoff: the private serving daemon has no GHCR token.
      # It can load this checksummed archive without receiving CI credentials.
      - name: Export verified image for local deployment
        if: runner.environment == 'self-hosted' && vars.CI_DELIVERY_DIR != ''
        env:
          DELIVERY_DIR: ${{ vars.CI_DELIVERY_DIR }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXPORT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          source="$REGISTRY/$IMAGE_NAME@$DIGEST"
          mkdir -p "$DELIVERY_DIR"
          staging=$(mktemp -d "$DELIVERY_DIR/.export.XXXXXX")
          chmod 700 "$staging"
          trap 'rm -rf -- "$staging"' EXIT
          docker pull "$source"
          image_id=$(docker image inspect --format '{{.Id}}' "$source")
          revision=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$source")
          [[ "$revision" == "$SOURCE_SHA" ]]
          docker image save --output "$staging/image.tar" "$image_id"
          (cd "$staging" && sha256sum image.tar > SHA256SUMS)
          printf '%s\n' "$source" > "$staging/registry-reference"
          printf '%s\n' "$image_id" > "$staging/image-id"
          printf '%s\n' "$SOURCE_SHA" > "$staging/source-sha"
          printf '%s\n' "$RUN_URL" > "$staging/verified-run"
          destination="$DELIVERY_DIR/$SOURCE_SHA-${DIGEST#sha256:}-$EXPORT_ID"
          # A previous receipt is immutable; never overwrite it on a retry.
          [[ ! -e "$destination" ]]
          mv -T "$staging" "$destination"
          printf 'Verified local image archive: %s\n' "$destination" >> "$GITHUB_STEP_SUMMARY"

      - name: Promote the verified digest without rebuilding
        id: promote
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.source.outputs.version }}
        shell: bash
        run: |
          image="$REGISTRY/$IMAGE_NAME"
          source="$image@$DIGEST"
          if [[ "$CHANNEL" == "edge" ]]; then
            docker buildx imagetools create --tag "$image:edge" "$source"
            echo "tags=edge" >> "$GITHUB_OUTPUT"
          else
            IFS=. read -r major minor patch <<< "$VERSION"
            # A published version tag is immutable. The quarantine push above
            # created the package, so any lookup error but "not found" stops here.
            if published=$(docker buildx imagetools inspect "$image:v$VERSION" 2>&1); then
              published=$(awk '$1 == "Digest:" { print $2; exit }' <<< "$published")
              if [[ "$published" != "$DIGEST" ]]; then
                echo "$image:v$VERSION already names ${published:-another image};" \
                  "refusing to move it to $DIGEST" >&2
                exit 1
              fi
            elif [[ "$published" != *": not found"* ]]; then
              echo "cannot check whether $image:v$VERSION exists: $published" >&2
              exit 1
            fi
            # X.Y, X and latest follow the newest release on main in their series,
            # so publishing an older or backported release never moves them back.
            releases=$(git tag --list --merged refs/remotes/origin/main 'v[0-9]*' |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V)
            newest() {
              awk -v prefix="$1" 'index($0, prefix) == 1' <<< "$releases" | tail -1
            }
            tags=("$image:v$major.$minor.$patch")
            if [[ "$(newest "v$major.$minor.")" == "v$VERSION" ]]; then
              tags+=("$image:$major.$minor")
            fi
            if [[ "$(newest "v$major.")" == "v$VERSION" ]]; then
              tags+=("$image:$major")
            fi
            if [[ "$(newest v)" == "v$VERSION" ]]; then
              tags+=("$image:latest")
            fi
            args=()
            for tag in "${tags[@]}"; do
              args+=(--tag "$tag")
            done
            docker buildx imagetools create "${args[@]}" "$source"
            echo "tags=$(IFS=,; echo "${tags[*]#"$image:"}")" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize verified artifact
        if: always()
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PROMOTED_TAGS: ${{ steps.promote.outputs.tags }}
          SCAN_OUTCOME: ${{ steps.trivy.outcome }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          {
            echo "## Container delivery"
            echo
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Digest: \`$DIGEST\`"
            echo "- Scan outcome: \`$SCAN_OUTCOME\`"
            echo "- Promoted tags: \`${PROMOTED_TAGS:-none}\`"
            echo "- BuildKit provenance: enabled"
            echo "- BuildKit SBOM: enabled"
          } >> "$GITHUB_STEP_SUMMARY"
