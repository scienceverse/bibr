name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.9.8"
  PYTHON_VERSION: "3.12"

jobs:
  validate:
    name: Validate tag trust boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install locked uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false

      - name: Fetch the protected remote main ref
        run: git fetch --no-tags origin main

      - name: Require tag version and remote-main reachability
        id: version
        run: |
          version=$(python -c \
            "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$version" != "$tag_version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match project version $version" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tagged commit is not reachable from protected origin/main" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Require a current lockfile
        run: uv lock --check

  linux-tests:
    name: Release suite (Ubuntu, Python 3.12)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.2
        with:
          persist-credentials: false

      - name: Install locked uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false

      - name: Install full release environment
        run: uv sync --locked --extra all

      - name: Verify public source boundary
        run: uv run --locked python scripts/check_public_tree.py

      - name: Run release-critical suite
        run: uv run --locked --extra all pytest -m "not slow"

      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci

  cross-platform-core:
    name: Release core suite (${{ matrix.os }}, Python 3.12)
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    steps:
      - name: Checkout tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.2
        with:
          persist-credentials: false

      - name: Install locked uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false

      - name: Install core release environment
        run: uv sync --locked

      - name: Run core-compatible suite
        run: uv run --locked pytest -m "not slow" -q

      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci

  build-dist:
    name: Build and verify distributions once
    needs: [validate, linux-tests, cross-platform-core]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.2
        with:
          persist-credentials: false

      - name: Install locked uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false

      - name: Build sdist and wheel
        run: uv build

      - name: Gate distribution contents
        run: uv run --locked python scripts/check_dist_contents.py

      - name: Install wheel into a clean environment
        working-directory: /tmp
        run: |
          uv venv /tmp/bibr-release-smoke
          uv pip install --python /tmp/bibr-release-smoke/bin/python \
            "${{ github.workspace }}"/dist/*.whl
          /tmp/bibr-release-smoke/bin/bibr --help
          /tmp/bibr-release-smoke/bin/python -c \
            "import bibr; from bibr import LocalPipeline, Pipeline, Settings"
          if /tmp/bibr-release-smoke/bin/python -c "import torch" >/dev/null 2>&1; then
            echo "torch leaked into the core release wheel" >&2
            exit 1
          fi

      - name: Upload exact distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish-pypi:
    name: Publish exact distributions to PyPI
    # Internal-only until public launch: PyPI publishing stays OFF unless the
    # repository variable PUBLISH_PYPI is explicitly set to "true". A pushed v*
    # tag still builds, tests, produces a (private) GHCR image, and cuts an
    # internal GitHub Release — it just never reaches public PyPI while this
    # gate is unset. To go public later: set repo variable PUBLISH_PYPI=true and
    # configure the "pypi" environment + Trusted Publisher, then tag a release.
    if: ${{ vars.PUBLISH_PYPI == 'true' }}
    needs: [validate, build-dist]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: distributions-${{ github.sha }}
          path: dist/

      - name: Publish through Trusted Publishing
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          skip-existing: true

  publish-container:
    name: Publish exact release container
    needs: [validate, build-dist]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      channel: release
      source_sha: ${{ github.sha }}
      version: ${{ needs.validate.outputs.version }}

  github-release:
    name: Finalize GitHub Release
    needs: [validate, build-dist, publish-pypi, publish-container]
    # Still finalize the (private-repo, internal) Release when PyPI publishing is
    # gated off: require the build and the container, tolerate a *skipped*
    # publish-pypi, but never proceed if publish-pypi actually failed.
    if: >-
      ${{ !cancelled()
          && needs.build-dist.result == 'success'
          && needs.publish-container.result == 'success'
          && needs.publish-pypi.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: distributions-${{ github.sha }}
          path: dist/

      - name: Create or reconcile the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
