name: Release

on:
  push:
    tags: ["v*"]
  # Rehearse main through tests, build, and artifact checks without publishing.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.9.8"
  PYTHON_VERSION: "3.12"

jobs:
  validate:
    name: Validate release source
    runs-on: >-
      ${{ github.event.repository.private &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
      && vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # checkout fetches all branches/tags with its temporary authentication.
      # A later git fetch would be unauthenticated in this private repository.
      - name: Checkout full history including origin/main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install locked uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false

      - name: Require matching release tag or a main rehearsal
        id: version
        run: |
          version=$(python -c \
            "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/v* ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$version" != "$tag_version" ]]; then
              echo "tag $GITHUB_REF_NAME does not match project version $version" >&2
              exit 1
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" == refs/heads/main ]]; then
            echo "Rehearsing $version on main; all publishing jobs are disabled."
          else
            echo "expected a pushed v* tag or a manual rehearsal on main" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "release commit is not reachable from origin/main" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Require a current lockfile
        run: uv lock --check

  linux-tests:
    name: Release suite (Ubuntu, Python 3.12)
    needs: validate
    runs-on: >-
      ${{ github.event.repository.private &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
      && vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          persist-credentials: false

      - name: Install locked uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false

      - name: Install full release environment
        run: uv sync --locked --extra all

      - name: Verify public source boundary
        run: uv run --locked python scripts/check_public_tree.py

      - name: Run release-critical suite
        run: uv run --locked --extra all pytest -m "not slow"

      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci

  cross-platform-core:
    name: Release core suite (${{ matrix.os }}, Python 3.12)
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          persist-credentials: false

      - name: Install locked uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false

      - name: Install core release environment
        run: uv sync --locked

      - name: Install macOS input validation prerequisite
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install libmagic

      - name: Run core-compatible suite
        run: uv run --locked pytest -m "not slow" -q

      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci

  build-dist:
    name: Build and verify distributions once
    needs: [validate, linux-tests, cross-platform-core]
    runs-on: >-
      ${{ github.event.repository.private &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
      && vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          persist-credentials: false

      - name: Install locked uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false

      - name: Build sdist and wheel
        run: uv build

      - name: Gate distribution contents
        run: uv run --locked python scripts/check_dist_contents.py

      - name: Validate PyPI metadata and README rendering
        run: uv tool run --from twine==7.0.0 twine check --strict dist/*

      - name: Install wheel into a clean environment
        working-directory: /tmp
        run: |
          uv venv "${RUNNER_TEMP}/bibr-release-smoke"
          uv pip install --python "${RUNNER_TEMP}/bibr-release-smoke/bin/python" \
            "${{ github.workspace }}"/dist/*.whl
          "${RUNNER_TEMP}/bibr-release-smoke/bin/bibr" --help
          "${RUNNER_TEMP}/bibr-release-smoke/bin/python" -c \
            "import bibr; from bibr import LocalPipeline, Pipeline, Settings"
          if "${RUNNER_TEMP}/bibr-release-smoke/bin/python" -c "import torch" >/dev/null 2>&1; then
            echo "torch leaked into the core release wheel" >&2
            exit 1
          fi

      - name: Upload exact distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish-pypi:
    name: Publish exact distributions to PyPI
    # Keep PUBLISH_PYPI=false until the release owner confirms publication.
    # Manual rehearsals cannot publish, even when that switch is enabled.
    if: >-
      ${{ github.event_name == 'push'
          && startsWith(github.ref, 'refs/tags/v')
          && vars.PUBLISH_PYPI == 'true' }}
    needs: [validate, build-dist]
    # PyPA supports this action on GitHub-hosted Linux runners only.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/bibr/
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: distributions-${{ github.sha }}
          path: dist/

      - name: Publish through Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true

  publish-container:
    name: Publish exact release container
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [validate, build-dist]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      channel: release
      source_sha: ${{ github.sha }}
      version: ${{ needs.validate.outputs.version }}

  github-release:
    name: Finalize GitHub Release
    needs: [validate, build-dist, publish-pypi, publish-container]
    # Still finalize the (private-repo, internal) Release when PyPI publishing is
    # gated off: require the build and the container, tolerate a *skipped*
    # publish-pypi, but never proceed if publish-pypi actually failed.
    if: >-
      ${{ !cancelled()
          && github.event_name == 'push'
          && startsWith(github.ref, 'refs/tags/v')
          && needs.build-dist.result == 'success'
          && needs.publish-container.result == 'success'
          && (needs.publish-pypi.result == 'success'
              || (vars.PUBLISH_PYPI != 'true' && needs.publish-pypi.result == 'skipped')) }}
    runs-on: >-
      ${{ github.event.repository.private &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
      && vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: distributions-${{ github.sha }}
          path: dist/

      - name: Create or reconcile the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
