# SonarQube analysis for bibr.
#
# Scope: a post-merge quality trend on `main`, published to the self-hosted
# SonarQube service. It is NOT a PR gate — SonarQube Community Build analyses
# a single branch, and branch/PR analysis is a Developer Edition feature. The
# gates that can block a merge stay in .github/workflows/ci.yml: ruff, mypy on
# the strict core, semgrep, trivy, the dependency audit and codecov's 75% floor.
#
# Read it for what the other tools do not report: duplication, cognitive
# complexity, and how both move over time.

sonar.projectKey=bibr
sonar.projectName=bibr
sonar.organization=scienceverse

sonar.sources=bibr
sonar.tests=tests
sonar.python.version=3.12

# Produced by the `test-primary` job (pytest --cov-report=xml) and handed over
# as an artifact rather than regenerated — re-running the suite here would
# double the cost of every main push to produce a file CI already has.
sonar.python.coverage.reportPaths=coverage.xml

# Vendored fixtures and generated output are not code under review. `site/` is
# the built MkDocs artifact; generic scoring utilities and runnable examples
# are outside the package's source-analysis scope.
sonar.exclusions=\
  bibr/data/**,\
  bibr/demo/**,\
  site/**,\
  evaluation/**,\
  benchmarks/**,\
  notebooks/**,\
  **/__pycache__/**

# Duplication is expected in tests — parallel cases that read clearly beat
# cleverly factored ones — so measure it on the package and not the suite.
sonar.cpd.exclusions=tests/**

sonar.sourceEncoding=UTF-8
